<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Walla Walla Tasting Rooms</title>

<!-- PWA / iOS home-screen app support -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6d1535">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WW Wineries">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
<link rel="apple-touch-icon" sizes="120x120" href="icons/icon-120.png">
<link rel="icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --gold:     #787542;
    --gold-lt:  #bab77e;
    --cream:    #faf3e7;
    --gray-1:   #f7f4f0;
    --gray-2:   #ede8e1;
    --gray-3:   #c8bfb2;
    --gray-4:   #7a6e63;
    --text:     #2a2420;
    --radius:   10px;
    --shadow:   0 2px 12px rgba(0,0,0,.10);
    --shadow-lg:0 6px 30px rgba(0,0,0,.18);
    --d-color:  #6d1535; --d-dark: #4b0e24; --d-mid: #9f2b55;
    --d-tint:   #fdf8f8; --d-bar:  #787542;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: var(--cream); color: var(--text); min-height: 100vh; }

  /* ── HERO ── */
  header { position: relative; min-height: 220px; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; color: #fff; }
  .hero-img { position: absolute; inset: 0; background-image: url('https://images.unsplash.com/photo-1560493676-04071c5f467b?auto=format&fit=crop&w=1600&q=80'); background-size: cover; background-position: center 60%; filter: brightness(.75) saturate(1.1); }
  .hero-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(30,10,14,.25) 0%, rgba(50,18,24,.55) 55%, rgba(60,22,30,.80) 100%); }
  .hero-content { position: relative; padding: calc(28px + env(safe-area-inset-top, 0px)) calc(32px + env(safe-area-inset-right, 0px)) 22px calc(32px + env(safe-area-inset-left, 0px)); display: flex; flex-wrap: wrap; align-items: flex-end; gap: 20px; }
  .title-block { flex: 1 1 300px; }
  header h1 { font-size: 2.1rem; font-weight: 300; letter-spacing: .18em; text-transform: uppercase; text-shadow: 0 2px 8px rgba(0,0,0,.5); }
  header p  { opacity: .7; font-size: .82rem; margin-top: 7px; letter-spacing: .12em; text-transform: uppercase; font-weight: 400; text-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .stats-bar { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; }
  .stat { text-align: center; background: rgba(255,255,255,.14); backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,.22); border-radius: 8px; padding: 7px 16px; }
  .stat .num { font-size: 1.5rem; font-weight: bold; line-height: 1; }
  .stat .lbl { font-size: .68rem; opacity: .8; text-transform: uppercase; letter-spacing: .09em; margin-top: 2px; }

  /* ── CONTROLS ── */
  .controls { background: var(--gray-1); border-bottom: 1px solid var(--gray-2); padding: 11px 32px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .controls input[type=text] { flex: 1 1 180px; padding: 7px 14px; border: 1px solid var(--gray-3); border-radius: 20px; font-size: .88rem; font-family: inherit; background: #fff; outline: none; }
  .controls input[type=text]:focus { border-color: #6d1535; }
  .filter-group { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
  .filter-btn { padding: 5px 13px; border: 1px solid var(--gray-3); border-radius: 20px; background: #fff; font-size: .8rem; cursor: pointer; transition: all .14s; font-family: inherit; }
  .filter-btn:hover { border-color: #9f2b55; }
  .filter-btn.active { background: #6d1535; border-color: #6d1535; color: #fff; }
  .filter-btn[data-filter="top"] { border-color: var(--gold); color: var(--gold); }
  .filter-btn[data-filter="top"].active { background: var(--gold); border-color: var(--gold); color: #fff; }
  /* inactive district buttons — colored outline + text */
  .filter-btn[data-filter="downtown"]  { border-color: #6d2b35; color: #6d2b35; }
  .filter-btn[data-filter="airport"]   { border-color: #1a4a6e; color: #1a4a6e; }
  .filter-btn[data-filter="eastside"]  { border-color: #2a5425; color: #2a5425; }
  .filter-btn[data-filter="westside"]  { border-color: #7a4915; color: #7a4915; }
  .filter-btn[data-filter="southside"] { border-color: #5a2e6a; color: #5a2e6a; }
  .filter-btn[data-filter="rocks"]     { border-color: #2e5c4a; color: #2e5c4a; }
  /* active — filled */
  .filter-btn[data-filter="downtown"].active  { background: #6d2b35; border-color: #6d2b35; color: #fff; }
  .filter-btn[data-filter="airport"].active   { background: #1a4a6e; border-color: #1a4a6e; color: #fff; }
  .filter-btn[data-filter="eastside"].active  { background: #2a5425; border-color: #2a5425; color: #fff; }
  .filter-btn[data-filter="westside"].active  { background: #7a4915; border-color: #7a4915; color: #fff; }
  .filter-btn[data-filter="southside"].active { background: #5a2e6a; border-color: #5a2e6a; color: #fff; }
  .filter-btn[data-filter="rocks"].active     { background: #2e5c4a; border-color: #2e5c4a; color: #fff; }
  .btn-add { margin-left: auto; padding: 7px 18px; background: #6d1535; color: #fff; border: none; border-radius: 20px; font-size: .86rem; cursor: pointer; font-family: inherit; transition: background .14s; }
  .btn-add:hover { background: #4b0e24; }


  /* ── DISTRICT COLORS ── */
  .district-section[data-district="downtown"]  { --d-color:#6d2b35; --d-dark:#4a1b22; --d-mid:#9b3d4a; --d-tint:#fdf8f9; --d-bar:#787542; }
  .district-section[data-district="airport"]   { --d-color:#1a4a6e; --d-dark:#0f2f4a; --d-mid:#2d6fa0; --d-tint:#f4f8fc; --d-bar:#5ba3cc; }
  .district-section[data-district="eastside"]  { --d-color:#2a5425; --d-dark:#193416; --d-mid:#3d7a36; --d-tint:#f4faf4; --d-bar:#7ab55a; }
  .district-section[data-district="westside"]  { --d-color:#7a4915; --d-dark:#562f0a; --d-mid:#b56e20; --d-tint:#fdf7f0; --d-bar:#d4904a; }
  .district-section[data-district="southside"] { --d-color:#5a2e6a; --d-dark:#38184a; --d-mid:#844da0; --d-tint:#faf5fd; --d-bar:#b87acf; }
  .district-section[data-district="rocks"]     { --d-color:#2e5c4a; --d-dark:#1a3830; --d-mid:#4a8c70; --d-tint:#f2faf6; --d-bar:#6ab890; }

  /* ── MAIN ── */
  main { padding: 24px 32px; }
  .district-section { margin-bottom: 36px; background: var(--d-tint); border-radius: 14px; overflow: hidden; border: 1px solid rgba(0,0,0,.06); box-shadow: 0 1px 6px rgba(0,0,0,.05); }
  .district-header-band { background: linear-gradient(135deg, var(--d-dark) 0%, var(--d-color) 55%, var(--d-mid) 100%); padding: 13px 20px 11px; display: flex; align-items: center; gap: 12px; cursor: pointer; user-select: none; }
  .district-header-band:hover { filter: brightness(1.07); }
  .district-chevron { color: rgba(255,255,255,.75); font-size: .65rem; transition: transform .22s ease; flex-shrink: 0; line-height: 1; }
  .district-section.collapsed .district-chevron { transform: rotate(-90deg); }
  .district-header-band h2 { font-size: .78rem; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: #fff; white-space: nowrap; text-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .district-progress { flex: 1; height: 6px; background: rgba(255,255,255,.25); border-radius: 3px; overflow: hidden; }
  .district-progress-fill { height: 100%; background: rgba(255,255,255,.85); border-radius: 3px; transition: width .4s ease; }
  .district-count { font-size: .8rem; color: rgba(255,255,255,.85); white-space: nowrap; font-family: sans-serif; }
  .winery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(295px, 1fr)); gap: 12px; padding: 16px; }
  .district-section.collapsed .winery-grid { display: none; }
  .district-section.collapsed { border-radius: 14px; }

  /* ── WINERY CARD ── */
  .winery-card { background: #fff; border-radius: var(--radius); border: 1px solid var(--gray-2); padding: 14px 14px 12px; cursor: pointer; transition: box-shadow .15s, border-color .15s, transform .1s; position: relative; }
  .winery-card:hover { box-shadow: var(--shadow); border-color: var(--gray-3); transform: translateY(-1px); }
  .winery-card.visited { border-left: 4px solid var(--d-color); }
  .winery-card.visited .card-name { color: var(--d-dark); }
  .winery-card.unvisited-varietal { opacity: .65; }

  .card-top { display: flex; align-items: flex-start; gap: 9px; flex-wrap: wrap; }
  .card-checkbox { width: 20px; height: 20px; min-width: 20px; border: 2px solid var(--gray-3); border-radius: 50%; margin-top: 2px; display: flex; align-items: center; justify-content: center; transition: all .15s; }
  .card-checkbox.checked { background: var(--d-color); border-color: var(--d-color); }
  .card-checkbox.checked::after { content: '✓'; color: #fff; font-size: .72rem; font-weight: bold; }
  .card-name { font-size: .93rem; font-weight: 500; flex: 1; line-height: 1.35; letter-spacing: .01em; }
  .card-district-badge { font-size: .66rem; padding: 2px 8px; border-radius: 10px; background: var(--gray-1); color: var(--gray-4); border: 1px solid var(--gray-2); white-space: nowrap; font-family: sans-serif; flex-shrink: 0; }

  .card-stars { display: flex; gap: 2px; margin: 7px 0 3px 29px; }
  .star { font-size: 1rem; cursor: pointer; color: var(--gray-3); transition: color .1s; }
  .star.lit { color: var(--d-bar, var(--gold)); }
  .star:hover { color: var(--d-mid); }

  .card-varietals { display: flex; flex-wrap: wrap; gap: 4px; margin: 5px 0 0 29px; }
  /* base chip */
  .varietal-chip { font-size: .66rem; padding: 2px 8px; border-radius: 10px; font-family: sans-serif; border: 1px solid transparent; }
  .varietal-chip.type-sparkling { background: #ddeaf5; color: #0f2f4a; border-color: #b8d0e8; }
  .varietal-chip.type-white     { background: #f7f0d4; color: #5c4408; border-color: #e0d090; }
  .varietal-chip.type-rose      { background: #fce8ef; color: #7a2040; border-color: #f0b8cc; }
  .varietal-chip.type-red       { background: #f5e4e6; color: #5a1520; border-color: #dcb0b4; }
  .varietal-chip.type-blend     { background: #ece7f0; color: #3f2a52; border-color: #cfc2dd; }
  /* highlighted chip in varietal view */
  .varietal-chip.highlight { font-weight: bold; box-shadow: 0 0 0 1px rgba(0,0,0,.15); }

  .card-note { margin: 7px 0 0 29px; font-size: .8rem; color: var(--gray-4); font-style: italic; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-date { margin: 5px 0 0 29px; font-size: .7rem; color: var(--gray-3); font-family: sans-serif; }


  /* ── MODAL ── */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.48); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .modal { background: #fff; border-radius: 14px; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); animation: slideUp .2s ease; }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-header { background: linear-gradient(135deg, var(--d-dark, #4b0e24), var(--d-color, #6d1535)); color: #fff; padding: 20px 24px 16px; border-radius: 14px 14px 0 0; display: flex; align-items: flex-start; justify-content: space-between; }
  .modal-header h3 { font-size: 1.2rem; font-weight: normal; }
  .modal-header .district-tag { font-size: .78rem; opacity: .75; margin-top: 3px; }
  .modal-close { background: none; border: none; color: rgba(255,255,255,.7); font-size: 1.4rem; cursor: pointer; line-height: 1; padding: 0 0 0 12px; }
  .modal-close:hover { color: #fff; }
  .modal-body { padding: 22px 24px; display: flex; flex-direction: column; gap: 18px; }

  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group label { font-size: .8rem; font-weight: bold; color: var(--gray-4); text-transform: uppercase; letter-spacing: .06em; font-family: sans-serif; }
  .form-group input[type=text], .form-group input[type=date], .form-group textarea, .form-group select { padding: 9px 13px; border: 1px solid var(--gray-3); border-radius: 8px; font-size: .92rem; font-family: inherit; outline: none; transition: border-color .15s; }
  .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: #6d1535; }
  .form-group textarea { resize: vertical; min-height: 80px; }

  .visited-toggle { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--gray-1); border-radius: 8px; cursor: pointer; }
  .toggle-switch { width: 44px; height: 24px; background: var(--gray-3); border-radius: 12px; position: relative; transition: background .2s; flex-shrink: 0; }
  .toggle-switch::after { content: ''; width: 18px; height: 18px; background: #fff; border-radius: 50%; position: absolute; top: 3px; left: 3px; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .toggle-switch.on { background: var(--gold); }
  .toggle-switch.on::after { transform: translateX(20px); }
  .toggle-label { font-size: .95rem; }

  .star-picker { display: flex; gap: 6px; }
  .star-picker .star { font-size: 1.6rem; cursor: pointer; color: var(--gray-3); transition: color .1s; }
  .star-picker .star.lit { color: var(--gold); }
  .star-picker .star:hover { color: #d4b060; }

  /* varietal picker with groups */
  .varietal-group { margin-bottom: 10px; }
  .varietal-group-label { font-size: .7rem; font-family: sans-serif; font-weight: bold; letter-spacing: .1em; text-transform: uppercase; padding: 3px 6px; border-radius: 4px; margin-bottom: 6px; display: inline-block; }
  .varietal-group-label.sparkling { background: #ddeaf5; color: #0f2f4a; }
  .varietal-group-label.white     { background: #f7f0d4; color: #5c4408; }
  .varietal-group-label.rose      { background: #fce8ef; color: #7a2040; }
  .varietal-group-label.red       { background: #f5e4e6; color: #5a1520; }
  .varietal-group-label.blend     { background: #ece7f0; color: #3f2a52; }
  .varietal-group-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .varietal-option { padding: 5px 12px; border: 1px solid var(--gray-3); border-radius: 20px; font-size: .78rem; cursor: pointer; font-family: sans-serif; transition: all .12s; background: #fff; }
  .varietal-option:hover { border-color: #9f2b55; }
  .varietal-option.selected.type-sparkling { background: #1a4a6e; border-color: #1a4a6e; color: #fff; }
  .varietal-option.selected.type-white     { background: #7a5c10; border-color: #7a5c10; color: #fff; }
  .varietal-option.selected.type-rose      { background: #9a2a50; border-color: #9a2a50; color: #fff; }
  .varietal-option.selected.type-red       { background: #6d1535; border-color: #6d1535; color: #fff; }
  .varietal-option.selected.type-blend     { background: #4f3a63; border-color: #4f3a63; color: #fff; }

  .modal-footer { padding: 16px 24px; border-top: 1px solid var(--gray-2); display: flex; justify-content: flex-end; gap: 10px; }
  .btn-save { padding: 9px 24px; background: #6d1535; color: #fff; border: none; border-radius: 8px; font-size: .9rem; cursor: pointer; font-family: inherit; }
  .btn-save:hover { background: #4b0e24; }
  .btn-save:disabled { background: var(--gray-3); cursor: not-allowed; opacity: .7; }
  .btn-save:disabled:hover { background: var(--gray-3); }
  .rating-hint { font-size: .78rem; color: #9f2b55; font-family: sans-serif; align-self: center; }
  .rating-hint.hidden { display: none; }
  .btn-cancel { padding: 9px 20px; background: none; border: 1px solid var(--gray-3); border-radius: 8px; font-size: .9rem; cursor: pointer; font-family: inherit; }
  .btn-cancel:hover { background: var(--gray-1); }
  .btn-delete { margin-right: auto; padding: 9px 16px; background: none; border: 1px solid transparent; border-radius: 8px; font-size: .9rem; cursor: pointer; font-family: inherit; color: #c0392b; }
  .btn-delete:hover { background: #fdecea; border-color: #e8b0a8; }

  .confirm-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 2000; align-items: center; justify-content: center; }
  .confirm-overlay.open { display: flex; }
  .confirm-box { background: #fff; border-radius: 12px; padding: 28px 30px; max-width: 340px; text-align: center; box-shadow: var(--shadow-lg); }
  .confirm-box h4 { margin-bottom: 10px; }
  .confirm-box p { font-size: .9rem; color: var(--gray-4); margin-bottom: 22px; }
  .confirm-btns { display: flex; gap: 10px; justify-content: center; }
  .btn-danger { padding: 8px 22px; background: #c0392b; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-family: inherit; }
  .btn-danger:hover { background: #96281b; }
  .empty { text-align: center; padding: 50px; color: var(--gray-4); font-size: .95rem; }
  .tr-varietal-list { display: flex; flex-direction: column; }
  .tr-varietal-row { display: flex; align-items: center; gap: 12px; padding: 11px 20px; border-bottom: 1px solid var(--gray-2); cursor: pointer; background: #fff; transition: background .12s; }
  .tr-varietal-row:last-child { border-bottom: none; }
  .tr-varietal-row:hover { background: var(--d-tint); }
  .tr-varietal-winery { flex: 1; font-size: .9rem; font-weight: 600; color: var(--gray-5, #4a4038); }
  .tr-varietal-stars { white-space: nowrap; }
  .tr-star { font-size: .95rem; color: var(--gray-3); }
  .tr-star.lit { color: var(--gold); }

  @media (max-width: 600px) {
    .hero-content { padding: calc(18px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-right, 0px)) 16px calc(16px + env(safe-area-inset-left, 0px)); }
    header h1 { font-size: 1.6rem; }
    .controls { padding: 9px 14px; }
    main { padding: 14px 10px; }
    .winery-grid { grid-template-columns: 1fr; padding: 10px; }
  }

  /* ── TRIP PLANNER ── */
  .btn-plan-toggle { padding: 7px 14px; background: #fff; color: var(--gray-4); border: 1px solid var(--gray-3); border-radius: 20px; font-size: .82rem; cursor: pointer; font-family: inherit; transition: all .14s; position: relative; }
  .btn-plan-toggle:hover { background: var(--gray-1); border-color: var(--gray-4); color: var(--text); }
  .btn-plan-toggle.has-items { border-color: #6d1535; color: #6d1535; }
  .plan-count-badge { display: inline-flex; align-items: center; justify-content: center; background: #6d1535; color: #fff; border-radius: 10px; font-size: .68rem; font-weight: bold; min-width: 16px; height: 16px; padding: 0 4px; margin-left: 5px; vertical-align: middle; }

  /* panel shell */
  .planner-panel { position: fixed; top: 0; right: -420px; width: 400px; height: 100vh; background: var(--cream); box-shadow: -6px 0 32px rgba(0,0,0,.18); z-index: 900; display: flex; flex-direction: column; transition: right .28s cubic-bezier(.4,0,.2,1); }
  .planner-panel.open { right: 0; }
  .planner-scrim { display: none; position: fixed; inset: 0; z-index: 899; background: rgba(0,0,0,.25); }
  .planner-scrim.open { display: block; }

  /* header */
  .planner-header { background: linear-gradient(135deg, #3a1218, #6d2b35); color: #fff; padding: 20px 20px 0; flex-shrink: 0; }
  .planner-header-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 14px; }
  .planner-title { font-size: 1.1rem; font-weight: 500; letter-spacing: .03em; }
  .planner-subtitle { font-size: .75rem; opacity: .7; margin-top: 3px; letter-spacing: .04em; }
  .planner-close { background: none; border: none; color: rgba(255,255,255,.6); font-size: 1.4rem; cursor: pointer; padding: 0; line-height: 1; transition: color .12s; }
  .planner-close:hover { color: #fff; }
  /* meta strip inside header */
  .planner-meta { display: flex; gap: 0; border-top: 1px solid rgba(255,255,255,.15); margin: 0 -20px; }
  .planner-meta-item { flex: 1; text-align: center; padding: 10px 6px; border-right: 1px solid rgba(255,255,255,.12); }
  .planner-meta-item:last-child { border-right: none; }
  .planner-meta-val { font-size: 1.05rem; font-weight: 600; line-height: 1; }
  .planner-meta-lbl { font-size: .62rem; opacity: .65; text-transform: uppercase; letter-spacing: .08em; margin-top: 2px; }
  /* date + group controls */
  .planner-controls { padding: 10px 14px; background: #fff; border-bottom: 1px solid var(--gray-2); display: flex; gap: 8px; align-items: center; flex-shrink: 0; }

const sortKey = s => s.replace(/^(the|a|an|l'|le|la|les)\s+/i, '').toLowerCase();

// ── RENDER ────────────────────────────────────────────────────────────────────

function render() {
  const query = document.getElementById('searchBox').value.toLowerCase();
  const main  = document.getElementById('mainContent');
  renderStats();

  if (currentFilter === 'top') { renderTopRated(query); return; }

  // base filter
  let filtered = wineries.filter(w => {
    if (query && !wineryMatchesQuery(w, query)) return false;
    if (currentFilter === 'all')       return true;
    if (currentFilter === 'visited')   return w.visited;
    if (currentFilter === 'unvisited') return !w.visited;
    if (currentFilter === 'rated')     return w.rating > 0;
    return w.district === currentFilter;
  });

  // ── normal district view ───────────────────────────────────────────────────
  const DISTRICTS = ['downtown','airport','eastside','westside','southside','rocks'];
  let html = '';
  let any  = false;

  DISTRICTS.forEach(d => {
    const dWineries = filtered
      .filter(w => w.district === d)
      .sort((a, b) => sortKey(a.name).localeCompare(sortKey(b.name)));
    if (!dWineries.length) return;
    any = true;

    const allD     = wineries.filter(w => w.district === d);
    const visitedD = allD.filter(w => w.visited).length;
    const pct      = allD.length ? Math.round(visitedD / allD.length * 100) : 0;

    const collapsed = collapsedDistricts.has(d) ? ' collapsed' : '';
    html += `
      <div class="district-section${collapsed}" data-district="${d}">
        <div class="district-header-band" onclick="toggleDistrict('${d}')">
          <span class="district-chevron">▼</span>
          <h2>${DISTRICT_LABELS[d]}</h2>
          <div class="district-progress"><div class="district-progress-fill" style="width:${pct}%"></div></div>
          <span class="district-count">${visitedD}/${allD.length}</span>
        </div>
        <div class="winery-grid">${dWineries.map(w => cardHTML(w, false)).join('')}</div>
      </div>`;
  });

  main.innerHTML = any ? html : '<div class="empty">No wineries match your search or filter.</div>';
}

// Matches a winery against the search query by name, district, varietals, or notes.
function wineryMatchesQuery(w, query) {
  if (w.name.toLowerCase().includes(query)) return true;
  const districtLabel = (DISTRICT_LABELS[w.district] || w.district).toLowerCase();
  if (districtLabel.includes(query)) return true;
  if (w.varietals.some(v => v.toLowerCase().includes(query))) return true;
  if (w.notes && w.notes.toLowerCase().includes(query)) return true;
  return false;
}

// ── TOP RATED VIEW ─────────────────────────────────────────────────────────────
// Shows an overall top-rated ranking plus the best-rated winery for each grape
// varietal the user has recorded.
function renderTopRated(query) {
  const main = document.getElementById('mainContent');
  const rated = wineries.filter(w => w.rating > 0 && (!query || wineryMatchesQuery(w, query)));

  if (!rated.length) {
    main.innerHTML = '<div class="empty">No rated wineries yet. Give a tasting room a star rating and it\'ll show up here.</div>';
    return;
  }

  const byRatingThenName = (a, b) => (b.rating - a.rating) || sortKey(a.name).localeCompare(sortKey(b.name));

  // Overall ranking (highest rated first).
  const overall = [...rated].sort(byRatingThenName);
  let html = `
    <div class="district-section" data-district="downtown">
      <div class="district-header-band" style="cursor:default;">
        <span style="font-size:1rem;">🏆</span>
        <h2>Your Top Rated</h2>
        <span class="district-count">${overall.length} rated</span>
      </div>
      <div class="winery-grid">${overall.map(w => cardHTML(w, true, false)).join('')}</div>
    </div>`;

  // Best winery per varietal (only varietals attached to rated wineries).
  const varietalBest = {};
  rated.forEach(w => {
    (w.varietals || []).forEach(v => {
      if (!varietalBest[v] || w.rating > varietalBest[v].rating) varietalBest[v] = w;
    });
  });
  const varietals = Object.keys(varietalBest).sort((a, b) =>
    (varietalBest[b].rating - varietalBest[a].rating) || a.localeCompare(b));

  if (varietals.length) {
    const rows = varietals.map(v => {
      const w = varietalBest[v];
      const stars = [1,2,3,4,5].map(i => `<span class="tr-star ${i<=w.rating?'lit':''}">★</span>`).join('');
      return `
        <div class="tr-varietal-row" onclick="openModal('${w.id}')">
          <span class="varietal-chip type-${varietalType(v)}">${escHtml(v)}</span>
          <span class="tr-varietal-winery">${escHtml(w.name)}</span>
          <span class="tr-varietal-stars">${stars}</span>
        </div>`;
    }).join('');
    html += `
      <div class="district-section" data-district="southside">
        <div class="district-header-band" style="cursor:default;">
          <span style="font-size:1rem;">🍇</span>
          <h2>Best By Varietal</h2>
          <span class="district-count">${varietals.length} varietals</span>
        </div>
        <div class="tr-varietal-list">${rows}</div>
      </div>`;
  }

  main.innerHTML = html;
}

// ── CARD HTML ─────────────────────────────────────────────────────────────────

function chipHTML(v, highlight) {
  const t = varietalType(v);
  return `<span class="varietal-chip type-${t}${highlight?' highlight':''}">${escHtml(v)}</span>`;
}

function cardHTML(w, showDistrict, showPlan = true) {
  const stars = [1,2,3,4,5].map(i =>
    `<span class="star ${i<=w.rating?'lit':''}" onclick="quickRate(event,'${w.id}',${i})">★</span>`
  ).join('');
  const chips = sortVarietals(w.varietals).map(v => chipHTML(v, false)).join('');
  const badge = showDistrict
    ? `<span class="card-district-badge">${DISTRICT_LABELS[w.district]}</span>` : '';
  const inPlan  = planList.includes(w.id);
  const planBtn = showPlan
    ? `<button class="card-plan-btn ${inPlan?'in-plan':''}" title="${inPlan?'Remove from trip plan':'Add to trip plan'}" onclick="togglePlan(event,'${w.id}')">${inPlan?'✓ Planned':'+ Plan'}</button>`
    : '';

  return `
    <div class="winery-card ${w.visited?'visited':''}" onclick="openModal('${w.id}')">
      <div class="card-top">
        <div class="card-checkbox ${w.visited?'checked':''}"></div>
        <span class="card-name">${escHtml(w.name)}</span>
        ${badge}
        ${planBtn}
      </div>
      ${w.visited?`<div class="card-stars">${stars}</div>`:''}
      ${chips?`<div class="card-varietals">${chips}</div>`:''}
      ${w.notes?`<div class="card-note">${escHtml(w.notes)}</div>`:''}
      ${w.dateVisited?`<div class="card-date">Visited ${formatDate(w.dateVisited)}</div>`:''}
    </div>`;
}

function renderStats() {
  const total   = wineries.length;
  const visited = wineries.filter(w => w.visited).length;
  const pct     = total ? Math.round(visited / total * 100) : 0;
  document.getElementById('statsBar').innerHTML = `
    <div class="stat"><div class="num">${total}</div><div class="lbl">Wineries</div></div>
    <div class="stat"><div class="num">${visited}</div><div class="lbl">Visited</div></div>
    <div class="stat"><div class="num">${total - visited}</div><div class="lbl">To Go</div></div>
    <div class="stat"><div class="num">${pct}%</div><div class="lbl">Complete</div></div>`;
}

function togglePlan(e, id) {

  if (i >= 0) { planList.splice(i, 1); planDoneSet.delete(id); }
  else        { planList.push(id); }
  savePlan();
  savePlanMeta();
  updatePlanBadge();
  render();
  if (document.getElementById('plannerPanel').classList.contains('open')) renderPlannerPanel();
}

function updatePlanBadge() {
  const badge = document.getElementById('planBadge');

  badge.style.display = planList.length ? '' : 'none';

function plannerEstTime() {
  const n = planList.length;
  if (!n) return '—';
  const mins = n * 50;
  const h = Math.floor(mins / 60), m = mins % 60;
  return m ? `${h}h ${m}m` : `${h}h`;
}

function renderPlannerPanel() {
  const body    = document.getElementById('plannerBody');
  const dirBtn  = document.getElementById('directionsBtn');
  const copyBtn = document.getElementById('copyPlanBtn');
  const doneCount = planList.filter(id => planDoneSet.has(id)).length;

  // update meta strip
  document.getElementById('metaStops').textContent = planList.length;
  document.getElementById('metaDone').textContent  = doneCount;
  document.getElementById('metaTime').textContent  = plannerEstTime();

  // update subtitle
  const sub = document.getElementById('plannerSubtitle');
  if (planDate) {
    const [y,mo,d] = planDate.split('-');
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    sub.textContent = `${months[+mo-1]} ${+d}, ${y}`;
  } else {
    sub.textContent = planList.length ? `${planList.length} stop${planList.length>1?'s':''}` : 'Add wineries with + on any card';
  }

  if (!planList.length) {
    body.innerHTML = `<div class="planner-empty">
      <div class="planner-empty-icon">🍷</div>
      <div class="planner-empty-title">Your trip starts here</div>
      <div class="planner-empty-body">Tap <strong>+</strong> on any winery card to build your itinerary. Reorder, check off stops as you go, and launch turn-by-turn directions when you're ready.</div>
    </div>`;
    dirBtn.disabled = true;
    if (copyBtn) copyBtn.disabled = true;
    return;
  }
  dirBtn.disabled = false;
  if (copyBtn) copyBtn.disabled = false;

  // build ordered list, optionally grouped by district
  let orderedIds = planList;
  let html = '';

  if (planGrouped) {
    // group while preserving relative order within each district
    const districtOrder = [];
    const byDistrict = {};
    orderedIds.forEach((id, origIdx) => {
      const w = wineries.find(x => x.id === id);
      if (!w) return;
      if (!byDistrict[w.district]) { byDistrict[w.district] = []; districtOrder.push(w.district); }
      byDistrict[w.district].push({ id, origIdx });
    });
    let stopNum = 1;
    districtOrder.forEach(d => {
      const dc = DISTRICT_COLORS[d] || { color: '#6d1535' };
      html += `<div class="planner-group-label" style="color:${dc.color}">${escHtml(DISTRICT_LABELS[d] || d)}</div>`;
      byDistrict[d].forEach(({ id, origIdx }) => {
        html += plannerItemHTML(id, origIdx, stopNum++, planList.length);
      });
    });
  } else {
    orderedIds.forEach((id, i) => {
      html += plannerItemHTML(id, i, i + 1, planList.length);
    });
  }

  body.innerHTML = html;

  // restore note input values
  document.querySelectorAll('.planner-item-note-input').forEach(inp => {
    inp.value = planNotes[inp.dataset.id] || '';
  });
  initPlannerDrag();
}

function plannerItemHTML(id, listIndex, stopNum, total) {
  const w = wineries.find(x => x.id === id);
  if (!w) return '';
  const dc     = DISTRICT_COLORS[w.district] || { color: '#6d1535' };
  const isDone = planDoneSet.has(id);
  const stars  = w.rating ? '★'.repeat(w.rating) : '';

  return `<div class="planner-item${isDone?' done':''}" data-index="${listIndex}" draggable="true">
    <div class="planner-item-handle" title="Drag to reorder"></div>
    <div class="planner-item-accent" style="background:${dc.color}"></div>
    <div class="planner-item-inner">
      <div class="planner-item-check" onclick="togglePlanDone('${escHtml(id)}')" title="${isDone?'Mark not done':'Mark done'}"></div>
      <span class="planner-item-num">${stopNum}</span>
      <div class="planner-item-info">
        <div class="planner-item-name">${escHtml(w.name)}</div>
        <div class="planner-item-meta">
          <span style="color:${dc.color};font-weight:600">${escHtml(DISTRICT_LABELS[w.district]||w.district)}</span>
          ${w.visited && stars ? `<span class="planner-item-stars">${stars}</span>` : ''}
          ${w.visited ? '<span>· ✓ Visited</span>' : ''}
        </div>
      </div>
    </div>
    <div class="planner-item-note-col">
      <textarea class="planner-item-note-input" data-id="${escHtml(id)}" placeholder="Note…" oninput="planNotes[this.dataset.id]=this.value;savePlanMeta()"></textarea>
      <button class="planner-remove-btn" onclick="removePlanItem(${listIndex})" title="Remove">✕</button>
    </div>
  </div>`;
}

function togglePlanDone(id) {
  if (planDoneSet.has(id)) planDoneSet.delete(id);
  else {
    planDoneSet.add(id);
    // also mark winery as visited if it isn't already
    const w = wineries.find(x => x.id === id);
    if (w && !w.visited) {
      w.visited = true;
      w.dateVisited = planDate || new Date().toISOString().slice(0,10);
      saveData();
      render();
    }
  }
  savePlanMeta();
  renderPlannerPanel();
  updatePlanBadge();
}

/* drag-and-drop reorder — wired up after every renderPlannerPanel() */
let _dragSrcIndex = null;

function initPlannerDrag() {
  const body  = document.getElementById('plannerBody');
  const items = body.querySelectorAll('.planner-item[draggable]');

  items.forEach(item => {
    // ── mouse / desktop drag ──────────────────────────────────────────────────
    item.addEventListener('dragstart', e => {
      _dragSrcIndex = parseInt(item.dataset.index, 10);
      item.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', _dragSrcIndex);
    });
    item.addEventListener('dragend', () => {
      item.classList.remove('dragging');
      body.querySelectorAll('.planner-item').forEach(i => i.classList.remove('drag-over'));
    });
    item.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      body.querySelectorAll('.planner-item').forEach(i => i.classList.remove('drag-over'));
      item.classList.add('drag-over');
    });
    item.addEventListener('dragleave', () => item.classList.remove('drag-over'));
    item.addEventListener('drop', e => {
      e.preventDefault();
      item.classList.remove('drag-over');
      const toIndex = parseInt(item.dataset.index, 10);
      if (_dragSrcIndex === null || _dragSrcIndex === toIndex) return;
      // persist note inputs before mutating the list
      body.querySelectorAll('.planner-item-note-input').forEach(inp => {
        planNotes[inp.dataset.id] = inp.value;
      });
      const moved = planList.splice(_dragSrcIndex, 1)[0];
      planList.splice(toIndex, 0, moved);
      savePlan();
      renderPlannerPanel();
    });

    // ── touch drag (pointer events) ───────────────────────────────────────────
    const handle = item.querySelector('.planner-item-handle');
    if (!handle) return;

    let touchSrcIndex = null, clone = null, startY = 0, lastY = 0;

    handle.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse') return; // let dragstart handle mouse
      e.preventDefault();
      handle.setPointerCapture(e.pointerId);
      touchSrcIndex = parseInt(item.dataset.index, 10);
      startY = e.clientY;
      lastY  = e.clientY;

      // create floating clone
      const rect = item.getBoundingClientRect();
      clone = item.cloneNode(true);
      clone.style.cssText = `position:fixed;left:${rect.left}px;width:${rect.width}px;top:${rect.top}px;z-index:9999;opacity:.85;box-shadow:0 8px 24px rgba(0,0,0,.22);pointer-events:none;border-radius:10px;`;
      document.body.appendChild(clone);
      item.classList.add('dragging');
    });

    handle.addEventListener('pointermove', e => {
      if (!clone) return;
      e.preventDefault();
      const dy = e.clientY - startY;
      const rect = item.getBoundingClientRect();
      clone.style.top = (rect.top + dy) + 'px';
      lastY = e.clientY;

      // find the item we're hovering over
      body.querySelectorAll('.planner-item').forEach(i => i.classList.remove('drag-over'));
      const els = body.querySelectorAll('.planner-item');
      els.forEach(el => {
        const r = el.getBoundingClientRect();
        if (lastY >= r.top && lastY <= r.bottom) el.classList.add('drag-over');
      });
    });

    handle.addEventListener('pointerup', e => {
      if (!clone) return;
      clone.remove(); clone = null;
      item.classList.remove('dragging');
      body.querySelectorAll('.planner-item').forEach(i => i.classList.remove('drag-over'));

      // find drop target
      let dropIndex = null;
      body.querySelectorAll('.planner-item').forEach(el => {
        const r = el.getBoundingClientRect();
        if (lastY >= r.top && lastY <= r.bottom) dropIndex = parseInt(el.dataset.index, 10);
      });

      if (dropIndex !== null && dropIndex !== touchSrcIndex) {
        body.querySelectorAll('.planner-item-note-input').forEach(inp => {
          planNotes[inp.dataset.id] = inp.value;
        });
        const moved = planList.splice(touchSrcIndex, 1)[0];
        planList.splice(dropIndex, 0, moved);
        savePlan();
        renderPlannerPanel();
      }
      touchSrcIndex = null;
    });
  });
}

function removePlanItem(index) {
  const id = planList[index];
  planList.splice(index, 1);
  planDoneSet.delete(id);
  savePlan();
  savePlanMeta();
  updatePlanBadge();
  renderPlannerPanel();
  render();
}

function clearPlan() {
  if (!planList.length) return;
  if (!confirm('Clear your entire trip plan?')) return;
  planList = [];
  planDoneSet.clear();
  savePlan();
  savePlanMeta();
  updatePlanBadge();
  renderPlannerPanel();
  render();
}

function openDirections() {
  if (!planList.length) return;
  const stops = planList.map(id => {
    const w = wineries.find(x => x.id === id);
    return w ? encodeURIComponent(w.name + ' Walla Walla WA') : null;
  }).filter(Boolean);
  if (!stops.length) return;
  const destination = stops[stops.length - 1];
  const waypoints   = stops.slice(0, -1).join('/');
  window.open('https://www.google.com/maps/dir/' + waypoints + '/' + destination, '_blank');
}

function copyItinerary() {
  if (!planList.length) return;
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  let header = 'Walla Walla Wine Trip';
  if (planDate) {
    const [y,mo,d] = planDate.split('-');
    header += ' · ' + months[+mo-1] + ' ' + (+d) + ', ' + y;
  }
  const lines = [header, ''];
  planList.forEach((id, i) => {
    const w = wineries.find(x => x.id === id);
    if (!w) return;
    const note = planNotes[id] ? '  (' + planNotes[id] + ')' : '';
    lines.push(`${i+1}. ${w.name} — ${DISTRICT_LABELS[w.district]||w.district}${note}`);
  });
  lines.push('');
  lines.push(`${planList.length} stop${planList.length>1?'s':''} · Est. ${plannerEstTime()}`);
  navigator.clipboard.writeText(lines.join('\n')).then(() => {
    const btn = document.getElementById('copyPlanBtn');
    const orig = btn.textContent;
    btn.textContent = '✓ Copied!';
    setTimeout(() => { btn.textContent = orig; }, 2000);
  }).catch(() => alert('Copy not supported in this browser'));
}

/* ── QUICK RATE (tap a star on a card) ─────────────────────────────────────── */

function quickRate(e, id, val) {
  e.stopPropagation();
  const w = wineries.find(x => x.id === id);
  if (!w) return;
  w.rating = (w.rating === val) ? 0 : val;
  if (w.rating > 0) w.visited = true;
  saveData(); render();
}

// ── MODAL ─────────────────────────────────────────────────────────────────────

function openModal(id) {
  editingId = id;
  const w = id ? wineries.find(x => x.id === id) : null;

  document.getElementById('modalTitle').textContent = w ? 'Review Winery' : 'Add Winery';
  document.getElementById('modalDistrictTag').textContent = w ? DISTRICT_LABELS[w.district] : '';

  const district = w ? w.district : 'downtown';
  const dc = DISTRICT_COLORS[district] || DISTRICT_COLORS.downtown;
  document.getElementById('modalHeader').style.background = `linear-gradient(135deg,${dc.dark},${dc.color})`;

  document.getElementById('fieldName').value     = w ? w.name        : '';
  document.getElementById('fieldDistrict').value = w ? w.district    : 'downtown';
  document.getElementById('fieldDate').value     = w ? w.dateVisited : '';
  document.getElementById('fieldNotes').value    = w ? w.notes       : '';

  document.getElementById('nameGroup').style.display     = '';
  // District is fixed when reviewing an existing winery (shown in the header tag);
  // the picker only appears when adding a new custom winery.
  document.getElementById('districtGroup').style.display = w ? 'none' : '';
  document.getElementById('deleteBtn').style.display     = w ? '' : 'none';

  modalVisited   = w ? w.visited  : false;
  modalRating    = w ? w.rating   : 0;
  modalVarietals = w ? [...w.varietals] : [];

  updateVisitedUI();
  renderStarPicker();
  renderVarietalPicker();
  updateSaveState();
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  editingId = null;
}
function overlayClick(e) { if (e.target === document.getElementById('modalOverlay')) closeModal(); }
function toggleVisited() { modalVisited = !modalVisited; updateVisitedUI(); }
function updateVisitedUI() {
  document.getElementById('visitedSwitch').classList.toggle('on', modalVisited);
  document.getElementById('visitedLabel').textContent = modalVisited ? 'Visited ✓' : 'Not yet visited';
}
function setRating(val) {
  modalRating = (modalRating === val) ? 0 : val;
  // Rating a winery means you've been there — auto-mark it visited.
  if (modalRating > 0) modalVisited = true;
  renderStarPicker();
  updateVisitedUI();
  updateSaveState();
}
function renderStarPicker() {
  document.querySelectorAll('#starPicker .star').forEach((s, i) => s.classList.toggle('lit', i < modalRating));
}
// When reviewing an existing winery, save is only allowed once a star rating
// exists (so picking varietals alone can't complete a review). Adding a brand-new
// custom winery doesn't require a rating.
function updateSaveState() {
  const canSave = !editingId || modalRating > 0;
  const btn  = document.getElementById('saveBtn');
  const hint = document.getElementById('ratingHint');
  if (btn)  btn.disabled = !canSave;
  if (hint) hint.classList.toggle('hidden', canSave);
}

function renderVarietalPicker() {
  document.getElementById('varietalPicker').innerHTML = VARIETAL_GROUPS.map(g => `
    <div class="varietal-group">
      <div class="varietal-group-label ${g.type}">${g.label}</div>
      <div class="varietal-group-chips">
        ${g.items.map(v => `
          <button type="button"
            class="varietal-option type-${g.type} ${modalVarietals.includes(v)?'selected':''}"
            onclick="toggleVarietal('${v.replace(/'/g,"\\'").replace(/\//g,"\\/")}')">
            ${escHtml(v)}
          </button>`).join('')}
      </div>
    </div>`).join('');
}

function toggleVarietal(v) {
  const idx = modalVarietals.indexOf(v);
  if (idx >= 0) modalVarietals.splice(idx,1); else modalVarietals.push(v);
  renderVarietalPicker();
}

function saveModal() {
  const name     = document.getElementById('fieldName').value.trim();
  const district = document.getElementById('fieldDistrict').value;
  if (!editingId && !name) { document.getElementById('fieldName').focus(); return; }
  // Reviewing an existing winery requires a star rating before saving.
  if (editingId && modalRating < 1) return;

  if (editingId) {
    const w = wineries.find(x => x.id === editingId);
    if (!w) return;
    w.name        = name || w.name;
    w.district    = district;
    w.visited     = modalVisited;
    w.rating      = modalRating;
    w.varietals   = [...modalVarietals];
    w.notes       = document.getElementById('fieldNotes').value.trim();
    w.dateVisited = document.getElementById('fieldDate').value;
  } else {
    wineries.push({ id:'w_'+Math.random().toString(36).slice(2), name, district,
      visited: modalVisited, dateVisited: document.getElementById('fieldDate').value,
      rating: modalRating, varietals: [...modalVarietals],
      notes: document.getElementById('fieldNotes').value.trim() });
  }
  saveData(); closeModal(); render();
}

// ── DELETE WINERY ───────────────────────────────────────────────────────────
let deletePendingId = null;

function askDeleteWinery() {
  if (!editingId) return;
  const w = wineries.find(x => x.id === editingId);
  if (!w) return;
  deletePendingId = editingId;
  document.getElementById('deleteConfirmText').textContent =
    `Permanently remove "${w.name}"? This can't be undone.`;
  document.getElementById('deleteOverlay').classList.add('open');
}

function closeDelete() {
  document.getElementById('deleteOverlay').classList.remove('open');
  deletePendingId = null;
}

function confirmDeleteWinery() {
  if (!deletePendingId) return;
  const id = deletePendingId;
  wineries = wineries.filter(x => x.id !== id);
  // also remove from any trip plan
  const pi = planList.indexOf(id);
  if (pi >= 0) planList.splice(pi, 1);
  planDoneSet.delete(id);
  delete planNotes[id];
  saveData(); savePlan(); savePlanMeta();
  closeDelete(); closeModal();
  updatePlanBadge(); render();
}


// ── UTILS ─────────────────────────────────────────────────────────────────────

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function formatDate(iso) {
  if (!iso) return '';
  const [y,m,d] = iso.split('-');
  const mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${mo[+m-1]} ${+d}, ${y}`;
}

document.addEventListener('keydown', e => { if (e.key==='Escape'){ closeModal(); closeDelete(); closePlanner(); }});

render();
updatePlanBadge();

// ── PWA: register service worker for offline app-shell caching ───────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
